[package]
name = "easy-gpui-l10n"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "CSV-first localization for Rust and GPUI, inspired by Flutter easy_localization"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dexter-cnx/easy-gpui-l10n"
homepage = "https://github.com/dexter-cnx/easy-gpui-l10n"
keywords = ["i18n", "l10n", "gpui", "csv", "localization"]
categories = ["internationalization"]

[features]
default = []
gpui = ["dep:gpui"]

[dependencies]
anyhow = "1"
csv = "1.3"
once_cell = "1.20"
serde_json = "1"
gpui = { version = "0.2.2", optional = true }

[dev-dependencies]
tempfile = "3"
