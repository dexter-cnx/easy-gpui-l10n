name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-msrv:
    name: Core (Rust 1.85 MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Demo
        run: cargo run --example demo

  gpui:
    name: GPUI feature (latest stable)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check GPUI integration
        run: cargo check --features gpui

  package:
    name: Cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify publishable package
        run: cargo package --allow-dirty
