name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Demo
        run: cargo run --example demo

  gpui:
    name: GPUI feature
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Check GPUI integration
        run: cargo check --features gpui
